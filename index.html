<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Escolar</title>
<meta name="description" content="Agenda escolar: hoy, tareas, asignaturas, eventos, notas, calendario y horario de clases.">
<meta name="theme-color" content="#5b5bd6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda Escolar">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Sprite de iconos SVG reutilizados en toda la app -->
<svg style="display:none">
  <defs>
    <symbol id="icon-today" viewBox="0 0 24 24"><path d="M12 2l1.8 4.6L18 8l-4.2 1.4L12 14l-1.8-4.6L6 8l4.2-1.4L12 2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v4l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-tasks" viewBox="0 0 24 24"><path d="M9 11l2 2 4-4" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="icon-projects" viewBox="0 0 24 24"><path d="M12 3.5L2.5 8.5 12 13.5l9.5-5L12 3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M6.5 10.8V15c0 1.7 2.8 3.2 5.5 3.2s5.5-1.5 5.5-3.2v-4.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M21.5 8.5V15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="icon-events" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9.5h17" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8.2" cy="13.6" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="13.6" r="1.15" fill="currentColor" stroke="none"/><circle cx="15.8" cy="13.6" r="1.15" fill="currentColor" stroke="none"/></symbol>
    <symbol id="icon-notes" viewBox="0 0 24 24"><path d="M6 3.5h9l4.5 4.5V19a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14.5 3.5V8h4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 12.2h8M8 15.8h5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9.5h17" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M7.5 13.2h2.2v2.2H7.5zM11 13.2h2.2v2.2H11zM14.5 13.2h2.2v2.2h-2.2zM7.5 16.6h2.2v2.2H7.5zM11 16.6h2.2v2.2H11z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="icon-schedule" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9h17M9 9v11M14.5 9v11" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V5a1.5 1.5 0 0 1 1.5-1.5h2A1.5 1.5 0 0 1 14.5 5v2M6.5 7l.7 12a2 2 0 0 0 2 1.9h5.6a2 2 0 0 0 2-1.9l.7-12" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M4 20l.9-4 10-10 3.1 3.1-10 10-4 .9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13.5 4.9L16 3l5 5-1.9 2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2.4M12 19v2.4M21.5 12h-2.4M5.4 12H3M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7M18.4 18.4l-1.7-1.7M7.3 7.3L5.6 5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-pin" viewBox="0 0 24 24"><path d="M12 2.5c-3 0-5.4 2.4-5.4 5.4 0 3.9 5.4 13.6 5.4 13.6s5.4-9.7 5.4-13.6c0-3-2.4-5.4-5.4-5.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="8" r="2.1" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.5V12l3.2 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-location" viewBox="0 0 24 24"><path d="M12 21.5s7-6.6 7-12A7 7 0 0 0 5 9.5c0 5.4 7 12 7 12z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="icon-attach" viewBox="0 0 24 24"><path d="M16.5 6.5l-7.1 7.1a3 3 0 0 0 4.24 4.24l7.6-7.6a5 5 0 0 0-7.07-7.07l-7.6 7.6a7 7 0 0 0 9.9 9.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-file" viewBox="0 0 24 24"><path d="M6 3.5h8l4.5 4.5V19a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 3.5V8h4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3.5v11.5M8 11l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 17v2.5A1.5 1.5 0 0 0 6 21h12a1.5 1.5 0 0 0 1.5-1.5V17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h13M21 18h-1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="15" cy="6" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="8" cy="12" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="17" cy="18" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="icon-monitor" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 20h8M12 16.5V20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div class="app-shell">

  <!-- Navegación lateral (escritorio) -->
  <nav class="side-nav" aria-label="Navegación principal">
    <div class="brand">
      <img src="icons/icon.svg" alt="" class="brand-mark">
      <span class="brand-name">Agenda Escolar</span>
    </div>
    <ul class="nav-list" id="nav-list">
      <li><button class="nav-item" data-view="today"><svg class="icon"><use href="#icon-today"/></svg><span>Hoy</span></button></li>
      <li><button class="nav-item" data-view="tasks"><svg class="icon"><use href="#icon-tasks"/></svg><span>Tareas</span></button></li>
      <li><button class="nav-item" data-view="subjects"><svg class="icon"><use href="#icon-projects"/></svg><span>Asignaturas</span></button></li>
      <li><button class="nav-item" data-view="events"><svg class="icon"><use href="#icon-events"/></svg><span>Eventos</span></button></li>
      <li><button class="nav-item" data-view="notes"><svg class="icon"><use href="#icon-notes"/></svg><span>Notas</span></button></li>
      <li><button class="nav-item" data-view="calendar"><svg class="icon"><use href="#icon-calendar"/></svg><span>Calendario</span></button></li>
      <li><button class="nav-item" data-view="schedule"><svg class="icon"><use href="#icon-schedule"/></svg><span>Horario</span></button></li>
    </ul>
  </nav>

  <!-- Contenido principal -->
  <main class="main-content">
    <header class="topbar">
      <h1 id="view-title">Hoy</h1>
      <div class="topbar-actions" id="topbar-actions"></div>
      <button class="icon-btn" id="settings-btn" aria-label="Ajustes">
        <svg class="icon"><use href="#icon-settings"/></svg>
      </button>
    </header>
    <div class="view-container" id="view-container">
      <!-- las vistas se renderizan aquí -->
    </div>
  </main>

  <!-- Navegación inferior (móvil) -->
  <nav class="bottom-nav" aria-label="Navegación principal móvil">
    <button class="nav-item" data-view="today"><svg class="icon"><use href="#icon-today"/></svg><span>Hoy</span></button>
    <button class="nav-item" data-view="tasks"><svg class="icon"><use href="#icon-tasks"/></svg><span>Tareas</span></button>
    <button class="nav-item" data-view="subjects"><svg class="icon"><use href="#icon-projects"/></svg><span>Asign.</span></button>
    <button class="nav-item" data-view="events"><svg class="icon"><use href="#icon-events"/></svg><span>Eventos</span></button>
    <button class="nav-item" data-view="notes"><svg class="icon"><use href="#icon-notes"/></svg><span>Notas</span></button>
    <button class="nav-item" data-view="calendar"><svg class="icon"><use href="#icon-calendar"/></svg><span>Cal.</span></button>
    <button class="nav-item" data-view="schedule"><svg class="icon"><use href="#icon-schedule"/></svg><span>Horario</span></button>
  </nav>
</div>

<!-- Overlay de modal genérico -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2 id="modal-title">Título</h2>
      <button class="icon-btn" id="modal-close" aria-label="Cerrar"><svg class="icon"><use href="#icon-close"/></svg></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
